<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primary School Test Paper Library</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --border:#d8dce1; --text:#1c2126; --muted:#5b6470; --accent:#2f6fed; --radius:10px; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  .wrap { max-width:920px; margin:0 auto; padding:36px 18px 60px; }
  header { margin-bottom:24px; } h1 { font-size:1.55rem; margin:0 0 5px; } header p { margin:0; color:var(--muted); }
  .filters { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:5px; }
  input,select { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text); font:inherit; }
  .count { color:var(--muted); font-size:.9rem; margin:8px 0 12px; }
  .papers { display:grid; gap:12px; }
  .paper { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:17px 18px; display:flex; justify-content:space-between; align-items:center; gap:20px; }
  .paper h2 { font-size:1rem; margin:0 0 5px; } .paper p { margin:0; color:var(--muted); font-size:.88rem; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px; }
  .tag { border:1px solid var(--border); border-radius:999px; padding:2px 9px; font-size:.75rem; color:var(--muted); }
  .open { flex:none; display:inline-block; border-radius:8px; padding:10px 15px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  .open:hover { background:#2559c7; } a:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid #94b8ff; outline-offset:2px; }
  .empty { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:24px; text-align:center; color:var(--muted); }
  @media(max-width:600px) { .filters { grid-template-columns:1fr; gap:8px; } .paper { align-items:flex-start; flex-direction:column; gap:12px; } .open { width:100%; text-align:center; } }
</style>
</head>
<body>
<main class="wrap">
  <header><h1>Primary School Test Paper Library</h1><p>Search and filter digitized papers, then choose one to begin.</p></header>
  <section class="filters" aria-label="Filter papers">
    <div><label for="search">Search papers</label><input id="search" type="search" placeholder="School, year, exam type…" autocomplete="off"></div>
    <div><label for="level">Level</label><select id="level"><option value="">All levels</option></select></div>
    <div><label for="subject">Subject</label><select id="subject"><option value="">All subjects</option></select></div>
  </section>
  <p class="count" id="count" aria-live="polite"></p>
  <section class="papers" id="papers" aria-label="Available papers"></section>
</main>
<script src="papers.js"></script>
<script>
(function () {
  const allPapers = typeof PAPERS === "undefined" ? [] : PAPERS;
  const search = document.getElementById("search"), level = document.getElementById("level"), subject = document.getElementById("subject");
  const list = document.getElementById("papers"), count = document.getElementById("count");
  const addOptions = (select, values) => [...new Set(values)].sort().forEach(value => { const o=document.createElement("option"); o.value=value; o.textContent=value; select.appendChild(o); });
  addOptions(level, allPapers.map(p=>p.level)); addOptions(subject, allPapers.map(p=>p.subject));
  function render() {
    const term=search.value.trim().toLowerCase();
    const matches=allPapers.filter(p=>(!level.value||p.level===level.value)&&(!subject.value||p.subject===subject.value)&&(!term||`${p.title} ${p.school} ${p.description} ${p.level} ${p.subject}`.toLowerCase().includes(term)));
    count.textContent=`${matches.length} ${matches.length===1?"paper":"papers"} available`;
    list.replaceChildren();
    if (!matches.length) { const empty=document.createElement("p"); empty.className="empty"; empty.textContent="No papers match these filters. Try a different search or choose All."; list.appendChild(empty); return; }
    matches.forEach(p=>{
      const article=document.createElement("article"); article.className="paper";
      const info=document.createElement("div"), tags=document.createElement("div"), title=document.createElement("h2"), desc=document.createElement("p"), link=document.createElement("a");
      tags.className="tags";
      [p.level,p.subject,`${p.questionCount} questions`].forEach(value=>{const tag=document.createElement("span");tag.className="tag";tag.textContent=value;tags.appendChild(tag);});
      title.textContent=p.title; desc.textContent=p.description; info.append(tags,title,desc);
      link.className="open"; link.href=p.path; link.textContent="Start paper"; link.setAttribute("aria-label",`Start ${p.title}`);
      article.append(info,link); list.appendChild(article);
    });
  }
  [search,level,subject].forEach(el=>el.addEventListener(el===search?"input":"change",render));
  render();
})();
</script>
</body>
</html>
